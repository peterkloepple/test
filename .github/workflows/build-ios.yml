# ===========================================================================
#  build-ios.yml - PA AV Toolbox iOS v1.0.0
#  Autor: T. Pfeiffer
#  Baut auf einem Cloud-Mac von GitHub eine UNSIGNIERTE .ipa.
#  Signieren + Installieren danach mit Sideloadly (Windows) und Apple-ID.
#  Start: automatisch bei jedem Upload/Push oder manuell unter
#         Actions > iOS-App bauen > Run workflow
# ===========================================================================
name: iOS-App bauen

concurrency:
  group: pa-av-toolbox-ios
  cancel-in-progress: true

on:
  push:
    branches: [ios-app]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: XcodeGen installieren und Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App bauen (ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild \
            -project PAAVToolbox.xcodeproj \
            -target PAAVToolbox \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-iphoneos/PAAVToolbox.app

      - name: Fehlerliste bei Abbruch
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -40 || true
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l//$'\n'/ }"; done || true

      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/PAAVToolbox.app Payload/
          zip -qry PA_AV_Toolbox_iOS_v1.0.0.ipa Payload
          ls -la PA_AV_Toolbox_iOS_v1.0.0.ipa

      - name: IPA bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PA_AV_Toolbox_iOS_v1.0.0_${{ matrix.os }}
          path: PA_AV_Toolbox_iOS_v1.0.0.ipa
          retention-days: 30
