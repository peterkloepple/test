# ===========================================================================
#  studio-ios.yml - Studio Control iOS - Cloud-Build v1.0.0
#  Autor: T. Pfeiffer
#  Baut auf einem Cloud-Mac von GitHub eine UNSIGNIERTE .ipa und stellt sie
#  als Release "Studio Control iOS" zum Download bereit.
#  Signieren + Installieren danach mit Sideloadly (Windows) und Apple-ID.
#  Start: automatisch bei jedem Push auf den Branch studio-ios oder manuell.
# ===========================================================================
name: Studio-App bauen

concurrency:
  group: studio-control-ios
  cancel-in-progress: true

on:
  push:
    branches: [studio-ios]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Intel-Mac ist meist sofort frei (macos-26 stand oft lange in der Warteschlange)
        os: [macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Neuestes Xcode waehlen
        run: |
          X="$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version

      - name: XcodeGen installieren und Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App bauen (ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild \
            -project StudioControl.xcodeproj \
            -target StudioControl \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 && RC=0 || RC=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -80 || true
          exit $RC

      - name: Fehlerliste bei Abbruch
        if: failure()
        run: |
          grep -E "error:" build.log | sed -E 's#^.*/Sources/#Sources/#' | sort -u | head -60 > errors.txt || true
          cat errors.txt
          n=0
          while IFS= read -r l; do
            n=$((n+1)); [ $n -gt 50 ] && break
            echo "::error::${l}"
          done < errors.txt

      - name: Fehlerliste hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
          retention-days: 5

      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/StudioControl.app Payload/
          zip -qry StudioControl_iOS.ipa Payload
          ls -la StudioControl_iOS.ipa

      - name: IPA bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: StudioControl_iOS_${{ matrix.os }}
          path: StudioControl_iOS.ipa
          retention-days: 30

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: IPA holen
        uses: actions/download-artifact@v4
        with:
          pattern: StudioControl_iOS_*
          path: ipa
      - name: Release aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          F="$(find ipa -name 'StudioControl_iOS.ipa' | head -1)"
          if [ -z "$F" ]; then echo "keine IPA gebaut"; exit 1; fi
          VER="$(date +%Y%m%d-%H%M)"
          cp "$F" StudioControl_iOS.ipa
          TAG="studio-ios-latest"
          NOTES="Studio Control iOS - Stand ${VER} (Commit ${GITHUB_SHA::7}). Installieren mit Sideloadly (Anleitung im Handbuch)."
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" StudioControl_iOS.ipa --clobber -R "$REPO"
            gh release edit "$TAG" --notes "$NOTES" -R "$REPO"
          else
            gh release create "$TAG" StudioControl_iOS.ipa --target "$GITHUB_SHA" --title "Studio Control iOS" --notes "$NOTES" -R "$REPO"
          fi

  screenshots:
    permissions:
      contents: write
    # Bildschirmfotos aller Seiten im iPhone-Simulator (Demo-Daten) - fuer das Handbuch
    runs-on: macos-15-intel
    timeout-minutes: 70
    continue-on-error: true
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4
      - name: Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Fuer Simulator bauen
        run: |
          set -o pipefail
          xcodebuild -project StudioControl.xcodeproj -target StudioControl -configuration Debug \
            -sdk iphonesimulator SYMROOT="$PWD/simbuild" CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 && RC=0 || RC=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" sim.log | sort -u | head -40 || true
          exit $RC
      - name: Simulator starten und Seiten fotografieren
        run: |
          DEV="$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          c=c or [x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")"
          echo "Geraet: $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl ui "$DEV" appearance dark || true
          xcrun simctl status_bar "$DEV" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          APP="$(find simbuild -name 'StudioControl.app' -type d | head -1)"
          xcrun simctl install "$DEV" "$APP"
          mkdir -p shots
          shot() {
            name="$1"; shift
            xcrun simctl terminate "$DEV" de.tpfeiffer.studiocontrol >/dev/null 2>&1 || true
            xcrun simctl launch "$DEV" de.tpfeiffer.studiocontrol -demo "$@" >/dev/null
            sleep 7
            xcrun simctl io "$DEV" screenshot "shots/$name.png" >/dev/null 2>&1
            echo "$name"
          }
          # Aufwaermen: erster Start dauert laenger
          xcrun simctl launch "$DEV" de.tpfeiffer.studiocontrol -demo >/dev/null; sleep 15
          shot 00_start
          shot 01_info -about 1
          for p in beamer tapo stegos clickshare touchpanel printer switch fritz speedport speedtest; do
            for k in 0 1 2 3 4 5 6 7; do
              shot "p_${p}_$k" -page "$p" -scrollPage "$k"
            done
            for k in 0 1 2 3; do
              shot "s_${p}_$k" -page "$p" -settings "$p" -scrollPage "$k"
            done
          done
          ls -la shots
      - name: Fotos hochladen
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          retention-days: 10
      - name: Fotos in Branch studio-ios-shots ablegen (fuer das Handbuch)
        run: |
          cd shots
          git init -q -b studio-ios-shots
          git config user.name "T. Pfeiffer"
          git config user.email "noreply@github.com"
          git add -A
          git commit -q -m "Bildschirmfotos ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" studio-ios-shots
