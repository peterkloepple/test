# PA Rechnung - iPhone/iPad-App bauen OHNE eigenen Mac  v1.2.6
# v1.2.6: reportlab + Pillow + charset-normalizer fest fuer iPhone arm64 (geht auch auf dem Intel-Mac)
# v1.2.5: Intel-Mac (sofort frei) + Apple-Silicon parallel; Pillow wird fest fuer iPhone arm64 eingebaut
# v1.2.4: zwei Apple-Silicon-Macs parallel (macos-26 und macos-14) - wer zuerst frei ist, liefert; Intel geht nicht (keine iPhone-Pakete)
# v1.2.3: Intel-Mac (macos-15-intel) - bei den Apple-Silicon-Macs hat GitHub gerade Engpaesse
# v1.2.2: macos-15 (macos-26 lange ohne freien Mac) - Xcode 26 wird dort ausgewaehlt
# v1.2.1: Xcode-Protokoll bei Fehlern kurz ausgeben
# v1.2.0: Mac mit macOS 26 + neuestem Xcode 26 (Briefcase verlangt Xcode 26, vorher nur 16.4)
# Laeuft bei GitHub auf einem Mac in der Cloud (GitHub Actions).
# Ergebnis: PA_Rechnung_unsigniert.ipa (Download unter "Artifacts") - Installieren am Windows-PC mit Sideloadly.
# Start: Reiter "Actions" -> "iPhone-App bauen" -> "Run workflow" (oder automatisch nach jedem Hochladen).
# Autor: T. Pfeiffer
name: iPhone-App bauen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["PA_Rechnung/**", "PARechnung_iOS/**", ".github/workflows/**"]

concurrency:
  group: iphone-app
  cancel-in-progress: true

jobs:
  ipa:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Neuestes Xcode waehlen
        run: |
          X="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version
      - name: Programm in die App kopieren
        run: bash PARechnung_iOS/prepare_programm.sh "$GITHUB_WORKSPACE/PA_Rechnung"
      - name: iPhone-Projekt erzeugen (BeeWare Briefcase)
        working-directory: PARechnung_iOS
        run: |
          python -m pip install --upgrade pip
          if xcodebuild -version | grep -qE "Xcode (2[6-9]|[3-9][0-9])"; then pip install "briefcase>=0.3.20"; else pip install "briefcase>=0.3.20,<0.4"; fi
          briefcase --version
          briefcase create iOS --no-input
      - name: reportlab + Pillow fuer iPhone (arm64) einbauen
        working-directory: PARechnung_iOS
        run: |
          D="$(find build -maxdepth 6 -type d -name 'app_packages.iphoneos' | head -1)"
          echo "Ziel: $D"
          python -m pip install --target "$D" --only-binary=:all: --no-deps --platform ios_13_0_arm64_iphoneos --implementation cp --python-version 3.12 --abi cp312 --extra-index-url https://pypi.anaconda.org/beeware/simple "pillow>=10" "reportlab>=4.0" "charset-normalizer>=3"
          ls "$D"
      - name: Bauen ohne Signatur
        working-directory: PARechnung_iOS
        run: |
          PROJ="$(find build -maxdepth 5 -name '*.xcodeproj' | head -1)"
          SCHEME="$(basename "$PROJ" .xcodeproj)"
          echo "Projekt: $PROJ  Schema: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > xcode.log 2>&1 && RC=0 || RC=$?
          echo "xcodebuild Ergebnis: $RC"
          grep -nE "error:|BUILD FAILED|Command .* failed|PhaseScriptExecution" xcode.log | head -60 || true
          if [ "$RC" != "0" ]; then echo "----- letzte Zeilen -----"; tail -100 xcode.log; exit $RC; fi
          APP="$(find dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          rm -rf out && mkdir -p out/Payload && cp -R "$APP" out/Payload/
          (cd out && zip -qry ../PA_Rechnung_unsigniert.ipa Payload)
          ls -la PA_Rechnung_unsigniert.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: PA_Rechnung_iPhone_${{ matrix.os }}
          path: PARechnung_iOS/PA_Rechnung_unsigniert.ipa
          retention-days: 30
